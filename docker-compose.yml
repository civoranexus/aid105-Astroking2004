services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: civora
      POSTGRES_PASSWORD: civora
      POSTGRES_DB: schemeassist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civora -d schemeassist || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://civora:civora@db:5432/schemeassist

volumes:
  pgdata:
