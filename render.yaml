services:
  - type: web
    name: schemeassist-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: src/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schemeassist-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ALLOW_ALL_ORIGINS
        value: "false"

  - type: web
    name: schemeassist-frontend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    envVars:
      - key: VITE_API_URL
        value: https://schemeassist-backend.onrender.com
      - key: NODE_ENV
        value: production

databases:
  - name: schemeassist-db
    plan: free
    region: oregon
