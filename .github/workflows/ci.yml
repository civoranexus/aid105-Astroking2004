name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./.data/ci_test.db
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
          pip install google-generativeai python-dotenv
      - name: Install dev tooling
        run: |
          pip install flake8 pytest httpx autopep8
      - name: Format with autopep8
        run: |
          autopep8 --in-place --recursive --aggressive --aggressive src tests
      - name: Lint (flake8)
        run: |
          python -m flake8 src tests --max-line-length=120
      - name: Run tests (treat warnings as errors)
        run: |
          PYTHONWARNINGS=error,ignore::DeprecationWarning python -m pytest -q
      - name: Import sanity check
        run: |
          python -c "import importlib, sys; sys.path.append('src'); importlib.import_module('backend.main'); print('import ok')"
